<body bgcolor="black">
    <font face="Agency FB">
    <h1 id="hd">⇛ Simple Calculator</h1>
    <div id="box">
    <DIV class="display" id="display">0</DIV>

    <div><button id="btnc" onclick="clearDisplay()"><b>C</b></button></div>
    <div><button id="btnp" onclick="addValue('%')" class="operator"><b>%</b></button></div>
    <div><button id="btnr" onclick="backspace()"><b>⌫</b></button></div>
    <div><button id="divide" onclick="addValue('/')" class="operator"><b>÷</b></button></div>

    <div><button id="btn7" onclick="addValue('7')"><b>7</b></button></div>
    <div><button id="btn8" onclick="addValue('8')"><b>8</b></button></div>
    <div><button id="btn9" onclick="addValue('9')"><b>9</b></button></div>
    <div><button id="multiply" onclick="addValue('*')" class="operator"><b>×</b></button></div>

    <div><button id="btn4" onclick="addValue('4')"><b>4</b></button></div>
    <div><button id="btn5" onclick="addValue('5')"><b>5</b></button></div>
    <div><button id="btn6" onclick="addValue('6')"><b>6</b></button></div>
    <div><button id="subtract" onclick="addValue('-')" class="operator"><b>-</b></button></div>

    <div><button id="btn1" onclick="addValue('1')"><b>1</b></button></div>
    <div><button id="btn2" onclick="addValue('2')"><b>2</b></button></div>
    <div><button id="btn3" onclick="addValue('3')"><b>3</b></button></div>
    <div><button id="add" onclick="addValue('+')" class="operator"><b>+</b></button></div>

    <div><button id="btns" onclick="addValue('√')" class="operator"><b>√</b></button></div>
    <div><button id="btn0" onclick="addValue('0')"><b>0</b></button></div>
    <div><button id="btnd" onclick="addValue('.')"><b>.</b></button></div>
    <div><button id="btne" onclick="calculate()" class="equal"><b>=</b></button></div>
    </div>

    <script>
       
        function addValue(value){
            if (value === '√') {
               
                let currentValue = parseFloat(display.innerText);
         
                if (currentValue < 0) {
                    display.innerText = "Error";
                } else {
                 
                    display.innerText = Math.sqrt(currentValue);
                }
            
            } else {
         
                if (display.innerText === "0" || display.innerText === "Error") {
                    display.innerText = value;
                } else {
                    display.innerText += value;
                }
            }
        }
        function clearDisplay(){
            display.innerText = "0";
        }

        function backspace(){
            let value = display.innerText;
            value = value.slice(0,-1);
            if(value ==""){
                value = "0"
            }
            display.innerText = value;
        }

        function calculate(){
            try{
                let expression = display.innerText;
                let result = eval(expression);
                display.innerText = result;
            }catch{
                display.innerText = "Error";
            }
            
        }
        
    </script>
